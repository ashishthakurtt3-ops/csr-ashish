{% extends "admin/base_admin.html" %}

{% block title %}Edit {{ company.company_name }}{% endblock %}
{% block page_title %}Update Corporate Record: {{ company.company_name }}{% endblock %}

{% block content %}
<div class="admin-card" style="max-width: 800px; margin: 0 auto;">
    <form method="POST" style="display:flex; flex-direction:column; gap:16px;">
        {% csrf_token %}
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div>
                <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Company Name *</label>
                <input type="text" name="company_name" value="{{ company.company_name }}" required style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
            </div>
            <div>
                <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Sector</label>
                <input type="text" name="sector" value="{{ company.sector }}" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div>
                <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Headquarters</label>
                <input type="text" name="headquarters" value="{{ company.headquarters }}" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
            </div>
            <div>
                <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Crawl Status</label>
                <select name="crawl_status" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
                    <option value="CRAWLED" {% if company.crawl_status == "CRAWLED" %}selected{% endif %}>CRAWLED</option>
                    <option value="PENDING" {% if company.crawl_status == "PENDING" %}selected{% endif %}>PENDING</option>
                    <option value="FAILED" {% if company.crawl_status == "FAILED" %}selected{% endif %}>FAILED</option>
                </select>
            </div>
        </div>

        <div>
            <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Corporate Website URL</label>
            <input type="url" name="website_url" value="{{ company.website_url }}" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
        </div>

        <div>
            <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">Careers Portal URL</label>
            <input type="url" name="careers_url" value="{{ company.careers_url }}" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
        </div>

        <div>
            <label style="display:block; font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:6px;">CSR Portal URL</label>
            <input type="url" name="csr_portal_url" value="{{ company.csr_portal_url }}" style="width:100%; box-sizing:border-box; padding:10px 12px; background:rgba(30,41,59,0.6); border:1px solid var(--admin-border); border-radius:6px; color:#fff; font-size:14px;">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px; border-top:1px solid var(--admin-border); padding-top:16px;">
            <a href="{% url 'admin_companies:detail' company.company_id %}" class="btn-admin btn-admin-secondary">Cancel</a>
            <button type="submit" class="btn-admin btn-admin-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
