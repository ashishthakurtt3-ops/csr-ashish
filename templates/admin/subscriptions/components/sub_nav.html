<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; background:var(--admin-surface); border:1px solid var(--admin-border); border-radius:12px; padding:12px 16px;">
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
        <a href="{% url 'admin_subscriptions:list' %}" class="btn-admin {% if active_tab == 'subscriptions' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Subscriptions
        </a>
        <a href="{% url 'admin_subscriptions:plans_list' %}" class="btn-admin {% if active_tab == 'plans' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Pricing Plans
        </a>
        <a href="{% url 'admin_subscriptions:payments_list' %}" class="btn-admin {% if active_tab == 'payments' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Payments
        </a>
        <a href="{% url 'admin_subscriptions:wallets_list' %}" class="btn-admin {% if active_tab == 'wallets' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><circle cx="16" cy="14" r="2"/></svg>
            Wallets
        </a>
        <a href="{% url 'admin_subscriptions:invoices' %}" class="btn-admin {% if active_tab == 'invoices' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Invoices &amp; GST
        </a>
        <a href="{% url 'admin_subscriptions:promos' %}" class="btn-admin {% if active_tab == 'promos' %}btn-admin-primary{% else %}btn-admin-secondary{% endif %}" style="font-size:12.5px; padding:6px 12px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            Promo Codes
        </a>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
        <span class="badge-status badge-pending" style="font-size:11px; font-weight:600;">Billing Engine</span>
        <form method="POST" action="{% url 'admin_subscriptions:run_renewals' %}" style="margin:0;" onsubmit="return EnterpriseConfirm.handleForm(event, {
            title: 'Authorize Scheduled Renewals Execution',
            subtitle: 'Initiate batch billing cycle verification and automated wallet settlement.',
            severity: 'finance',
            entity: {
                'Engine': 'ImpactBridge Institutional Billing Router',
                'Action': 'Process Expired Subscription Periods',
                'Method': 'Atomic Wallet Deduction & Invoicing'
            },
            impacts: [
                'Scans all active subscriptions where period end date has elapsed',
                'Debits corresponding plan renewal fees from user wallet balances',
                'Issues formal GST tax invoices and updates subscription coverage dates',
                'Records every settlement attempt in the statutory audit ledger'
            ],
            alert: 'Subscribers with insufficient wallet balances will enter grace period with automated payment failure notifications.',
            confirmText: 'Execute Renewals Run'
        });">
            {% csrf_token %}
            <button type="submit" class="btn-admin btn-admin-secondary" style="font-size:12px; padding:6px 12px; display:inline-flex; align-items:center; gap:6px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                Run Renewals
            </button>
        </form>
    </div>
</div>
