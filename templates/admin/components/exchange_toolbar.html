<!-- Enterprise Data Exchange & Direct Download Toolbar Component -->
<div class="toolbar-actions-group" style="display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <!-- 1. Primary Direct Download Button with Format Dropdown -->
    <div class="export-dropdown" style="display:inline-flex; align-items:stretch;">
        <a href="{% url 'admin_portal:data_export' entity %}?format=csv" 
           class="btn-admin btn-admin-download-main" 
           style="background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color:#ffffff; font-weight:600; font-size:13px; border:1px solid rgba(59,130,246,0.6); box-shadow:0 2px 10px rgba(37,99,235,0.4); text-decoration:none; display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:6px 0 0 6px; transition:all 0.15s ease;"
           title="Download all {% if title %}{{ title }}{% else %}{{ entity|title }}{% endif %} records with full details shown on website (Excel / CSV format)">
            <span style="font-size:14px;">📥</span> 
            <span>Download {% if title %}{{ title }}{% else %}{{ entity|title }}{% endif %} Details</span>
        </a>
        <button type="button" 
                class="btn-admin btn-admin-download-toggle" 
                onclick="event.stopPropagation(); toggleExportDropdown('exportMenu_{{ entity }}');" 
                style="background: #1e40af; color:#bfdbfe; border:1px solid rgba(59,130,246,0.6); border-left:1px solid rgba(255,255,255,0.2); padding:7px 9px; border-radius:0 6px 6px 0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;"
                title="More download options (CSV, JSON, Blank Templates)">
            <span style="font-size:10px; transition:transform 0.15s ease;">▼</span>
        </button>
        <div id="exportMenu_{{ entity }}" class="export-menu" style="min-width:230px;">
            <div style="padding:8px 12px; font-size:10.5px; font-weight:700; text-transform:uppercase; color:var(--admin-muted); letter-spacing:0.5px; border-bottom:1px solid var(--admin-border);">
                Download Formats
            </div>
            <a href="{% url 'admin_portal:data_export' entity %}?format=csv" class="export-item">
                <span>📊</span> <span>Download CSV (Excel Compatible)</span>
            </a>
            <a href="{% url 'admin_portal:data_export' entity %}?format=json" class="export-item">
                <span>📦</span> <span>Download Structured JSON</span>
            </a>
            <div style="border-top:1px solid var(--admin-border); margin:4px 0;"></div>
            <div style="padding:5px 12px; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--admin-muted); letter-spacing:0.5px;">Blank Templates</div>
            <a href="{% url 'admin_portal:data_template' entity %}?format=csv" class="export-item" style="font-size:12px; color:var(--admin-muted);">
                <span>📋</span> <span>Blank CSV Template</span>
            </a>
            <a href="{% url 'admin_portal:data_template' entity %}?format=json" class="export-item" style="font-size:12px; color:var(--admin-muted);">
                <span>📋</span> <span>Blank JSON Template</span>
            </a>
        </div>
    </div>

    <!-- 2. 1-Click Fast Sync Backup Button -->
    <a href="{% url 'admin_portal:quick_sync' entity %}" 
       class="btn-admin" 
       style="background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.35); color:#34d399; padding:7px 12px; text-decoration:none; display:inline-flex; align-items:center; gap:5px;"
       onclick="return confirm('⚡ 1-Click Fast Sync: Load all authentic {{ title|default:entity }} records directly from the master intelligence backup?');"
       title="1-Click reload authentic data for this section from master server backup">
        <span>⚡</span> <span>Sync Backup</span>
    </a>

    <!-- 3. Import Option Button -->
    <button type="button" 
            class="btn-admin btn-admin-secondary" 
            onclick="openImportModal('{{ entity }}', '{{ title|default:entity|title }}');" 
            title="Upload and import data file (.CSV, .JSON)" 
            style="padding:7px 12px; display:inline-flex; align-items:center; gap:5px;">
        <span>📤</span> <span>Import</span>
    </button>
</div>
