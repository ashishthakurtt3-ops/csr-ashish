{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sign In — ImpactBridge™ Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body.admin-login-body {
            margin: 0; padding: 0;
            background: #F8FAFC !important;
            background-image: none !important;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #0B1020;
            padding: 24px;
            box-sizing: border-box;
        }
        .login-card {
            width: 100%; max-width: 440px;
            background: #FFFFFF;
            border: 1px solid #E0E4EE;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px -15px rgba(10, 108, 255, 0.08), 0 0 1px 1px rgba(10, 108, 255, 0.05);
        }
        .brand-header-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0A6CFF 0%, #005CE0 100%);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px auto;
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(10, 108, 255, 0.35);
        }
        .login-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px; font-weight: 800;
            text-align: center; margin: 0 0 6px 0;
            color: #0B1020;
        }
        .login-subtitle {
            font-size: 13.5px; color: #465478;
            text-align: center; margin: 0 0 28px 0;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 600;
            color: #334155; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; height: 44px; padding: 0 14px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 10px; color: #0B1020; font-size: 14px;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .form-group input:focus {
            outline: none; border-color: #0A6CFF;
            box-shadow: 0 0 0 3px rgba(10, 108, 255, 0.18);
        }
        .btn-login {
            width: 100%; height: 46px;
            background: linear-gradient(135deg, #0A6CFF 0%, #005CE0 100%);
            box-shadow: 0 4px 14px rgba(10, 108, 255, 0.28);
            color: #FFFFFF; border: none; border-radius: 10px;
            font-size: 14.5px; font-weight: 700; cursor: pointer;
            margin-top: 8px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.15s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #005CE0 0%, #0446CB 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(10, 108, 255, 0.35);
        }
        .alert-error {
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #DC2626; padding: 12px 14px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px; font-weight: 500;
        }
        .login-footer {
            text-align: center; margin-top: 28px;
            padding-top: 20px; border-top: 1px solid #F1F5F9;
            font-size: 12.5px; color: #64748B;
        }
        .login-footer code {
            background: #F1F5F9; padding: 2px 6px;
            border-radius: 4px; font-family: monospace; color: #0F172A;
            font-weight: 600;
        }
        .return-link {
            color: #0A6CFF; text-decoration: none; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .return-link:hover { color: #005CE0; text-decoration: underline; }
    </style>
</head>
<body class="admin-login-body">
    <div class="login-card">
        <div class="brand-header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1 class="login-title">ImpactBridge™ Console</h1>
        <p class="login-subtitle">Enterprise ESG Governance &amp; Career Intelligence</p>

        {% if messages %}
            {% for msg in messages %}
            <div class="alert-error">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username or Corporate Email</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label class="form-label" style="margin-bottom:0;">Security Password</label>
                    <button type="button" onclick="toggleLoginPassword()" id="login-pwd-toggle" style="background:none; border:none; color:#0A6CFF; font-size:12px; font-weight:700; cursor:pointer; padding:0;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> <span>Show Password</span>
                    </button>
                </div>
                <div style="position:relative; display:flex; align-items:center;">
                    {{ form.password }}
                </div>
            </div>
            <button type="submit" class="btn-login">
                <span>Sign In to Console</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </form>

        <div class="login-footer">
            <a href="/" class="return-link">&larr; Return to Public Platform</a>
        </div>
    </div>

    <script>
    function toggleLoginPassword() {
        const pwdInput = document.querySelector('input[name="password"]');
        const toggleBtn = document.getElementById('login-pwd-toggle');
        if (!pwdInput) return;
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg> <span>Hide Password</span>';
            toggleBtn.style.color = '#64748B';
        } else {
            pwdInput.type = 'password';
            toggleBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; display:inline-block;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> <span>Show Password</span>';
            toggleBtn.style.color = '#0A6CFF';
        }
    }
    </script>
</body>
</html>
